name: Deploy Backend to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: test
    uses: ./.github/workflows/ci.yml

  trigger-render:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger Render deploy
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"